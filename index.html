<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="酒ログ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>酒ログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe7;--card:#fbf8f3;--ink:#1f1b17;--mu:#857c71;--line:#e2d9cc;
  --wine:#7b2233;--sake:#2d4a6b;--shochu:#6b5332;--beer:#b07a1a;--gold:#a9802f;
  --serif:"Shippori Mincho","Hiragino Mincho ProN",serif;
  --latin:"Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--ink)}
.hidden{display:none!important}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 110px)}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand{font-family:var(--serif);font-weight:700;font-size:28px;letter-spacing:.08em;margin:0}
.brand small{display:block;font-family:var(--latin);font-style:italic;font-weight:500;font-size:14px;letter-spacing:.04em;color:var(--mu)}
.iconbtn{border:none;background:none;color:var(--mu);font-size:13px;padding:6px 0}

/* filters */
.filters{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:none;background:none;padding:7px 11px;border-radius:999px;font-size:13px;color:var(--mu)}
.seg button.on{background:var(--ink);color:var(--paper)}
select.sort{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:13px;appearance:none;-webkit-appearance:none;color:var(--mu)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-size:15px;margin-bottom:16px}

/* list */
.count{font-size:12px;color:var(--mu);letter-spacing:.1em;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.item{border:none;padding:0;background:none;text-align:left;display:block}
.thumb{aspect-ratio:3/4;border-radius:10px;background:#e9e1d5 center/cover no-repeat;position:relative;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:34px;color:#c9bca9}
.tag{position:absolute;left:8px;top:8px;font-size:10px;letter-spacing:.12em;padding:3px 7px;border-radius:4px;color:#fff;background:var(--wine)}
.tag.sake{background:var(--sake)}
.tag.shochu{background:var(--shochu)}
.tag.beer{background:var(--beer)}
.again{position:absolute;right:8px;top:8px;font-size:10px;padding:3px 7px;border-radius:4px;background:rgba(255,255,255,.9);color:var(--gold)}
.item h3{font-family:var(--serif);font-size:14px;font-weight:700;line-height:1.4;margin:8px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item p{margin:0;font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{color:var(--gold);letter-spacing:1px;font-size:11px}
.empty{text-align:center;color:var(--mu);padding:60px 10px;line-height:1.9}
.empty b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:6px}

/* fab */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:20;border:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:15px 26px;font-size:15px;letter-spacing:.06em;box-shadow:0 8px 24px rgba(31,27,23,.25);display:flex;align-items:center;gap:8px}
.fab span{font-size:20px;line-height:1}

/* sheet (add / edit / detail) */
.sheet{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .inner{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 120px)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bar button{border:none;background:none;font-size:15px;padding:8px 0;color:var(--mu)}
.bar .ttl{font-family:var(--serif);font-weight:700;font-size:16px}

.shot{display:block;border:1.5px dashed #cdbfab;border-radius:14px;background:var(--card);padding:34px 16px;text-align:center;color:var(--mu);line-height:1.8}
.shot b{display:block;font-family:var(--serif);font-size:19px;color:var(--ink)}
.shot input{display:none}
.shot.menu{margin-top:10px;padding:16px;border-style:solid;border-width:1px;border-color:var(--line)}
.shot.menu b{font-size:16px}
.picStrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pic{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#e9e1d5}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.picTag{position:absolute;left:6px;top:6px;font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(31,27,23,.75);color:#fff}
.picDel{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:15px;line-height:26px;padding:0;color:var(--ink)}
.pic.add{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px dashed #cdbfab;background:var(--card);color:var(--mu);font-size:24px;cursor:pointer}
.pic.add small{font-size:10px;margin-top:4px;text-align:center;padding:0 4px;line-height:1.3}
.pic.add input{display:none}
.pichint{font-size:11px;color:var(--mu);margin:8px 0 0;text-align:center}
.reading{margin:14px 0;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mu);display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.note{margin:12px 0;padding:12px 14px;border-radius:10px;background:#f1e7d3;color:#6b5420;font-size:13px;line-height:1.6}
.err{background:#f5dede;color:#7b2233}

.sec{margin-top:22px}
.sec h4{font-size:11px;letter-spacing:.2em;color:var(--mu);margin:0 0 4px;font-weight:600}
.sec h4 em{font-style:normal;color:var(--gold);margin-left:6px;letter-spacing:.05em}
.f{display:block;margin-top:12px}
.f span{display:block;font-size:12px;color:var(--mu);margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;font-size:16px}
.f textarea{min-height:96px;resize:vertical;line-height:1.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai{border-color:#e0cfa8!important;background:#fbf5e8!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:13px}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.kindsw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.kindsw button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 4px;font-family:var(--serif);font-size:15px}
.kindsw button.on.wine{background:var(--wine);border-color:var(--wine);color:#fff}
.kindsw button.on.sake{background:var(--sake);border-color:var(--sake);color:#fff}
.kindsw button.on.shochu{background:var(--shochu);border-color:var(--shochu);color:#fff}
.kindsw button.on.beer{background:var(--beer);border-color:var(--beer);color:#fff}
.scale{display:flex;align-items:center;gap:8px;margin-top:6px}
.scale small{font-size:11px;color:var(--mu);flex:0 0 4.4em;text-align:center;white-space:nowrap}
.scale .dots{flex:1;display:flex;justify-content:space-between}
.scale .dots button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.scale .dots button.on{background:var(--ink);border-color:var(--ink)}
.rate{display:flex;gap:4px}
.rate button{border:none;background:none;font-size:30px;color:#d8ccb9;padding:0 2px;line-height:1}
.rate button.on{color:var(--gold)}
.toggle{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.toggle input{width:22px;height:22px;accent-color:var(--gold)}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:31;padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(rgba(244,239,231,0),var(--paper) 30%)}
.btn{display:block;width:100%;max-width:604px;margin:0 auto;border:none;border-radius:14px;padding:16px;background:var(--ink);color:var(--paper);font-size:16px;letter-spacing:.06em}
.btn:disabled{opacity:.45}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--wine);border:1px solid #e3c4c9;margin-top:10px}

/* detail */
.dgal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.dgal::-webkit-scrollbar{display:none}
.dhero{flex:0 0 100%;width:100%;aspect-ratio:3/4;max-height:60vh;object-fit:cover;border-radius:14px;background:#e9e1d5;display:block;scroll-snap-align:start}
.dgal.multi .dhero{flex-basis:86%}
.dgalhint{font-size:11px;color:var(--mu);margin:6px 0 0;text-align:right}
.dkind{display:inline-block;margin-top:16px;font-size:11px;letter-spacing:.15em;color:#fff;background:var(--wine);padding:3px 8px;border-radius:4px}
.dkind.sake{background:var(--sake)}
.dkind.shochu{background:var(--shochu)}
.dkind.beer{background:var(--beer)}
.dname{font-family:var(--serif);font-weight:700;font-size:24px;line-height:1.4;margin:8px 0 2px}
.dsub{color:var(--mu);font-size:13px;margin:0}
.drate{color:var(--gold);font-size:20px;letter-spacing:2px;margin:10px 0 0}
.dmemo{margin-top:16px;padding:14px 16px;background:var(--card);border-left:3px solid var(--gold);border-radius:4px 10px 10px 4px;line-height:1.8;white-space:pre-wrap;font-size:14px}
.dl{margin:18px 0 0;display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px}
.dl dt{color:var(--mu);font-size:12px;padding-top:2px}
.dl dd{margin:0}

/* auth */
#auth{max-width:400px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 70px) 22px 40px}
#auth h1{font-family:var(--serif);font-size:40px;letter-spacing:.1em;margin:0}
#auth .latin{font-family:var(--latin);font-style:italic;color:var(--mu);font-size:17px;margin:0 0 26px}
#auth p{color:var(--mu);font-size:13px;line-height:1.8}
#auth input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-size:16px;margin-top:10px}
#auth .btn{margin-top:16px}
.linkbtn{border:none;background:none;color:var(--mu);font-size:13px;margin-top:14px;text-decoration:underline;width:100%}
.webbtn{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:16px;border:1px solid var(--sake);color:var(--sake);background:none;border-radius:12px;padding:12px;font-size:15px}
.webbtn small{font-size:11px;color:var(--mu);margin-top:2px}
.webbtn:disabled{opacity:.45}
.cands{margin-top:4px;display:grid;gap:8px}
.cands b{font-size:12px;color:var(--mu);font-weight:600}
.cand{display:block;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px}
.cand strong{display:block;font-family:var(--serif);font-size:15px}
.cand span{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.cand.on{border-color:var(--gold);background:#fbf5e8;box-shadow:0 0 0 1px var(--gold) inset}
.srcs{margin-top:10px;font-size:12px;line-height:1.7}
.srcs b{display:block;color:var(--mu);font-weight:600;font-size:11px;letter-spacing:.1em}
.srcs a{color:var(--sake);word-break:break-all;display:block}
.ddesc{margin-top:14px;font-size:14px;line-height:1.8;color:#3d362f}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>

<section id="auth" class="hidden">
  <h1>酒ログ</h1>
  <p class="latin">a little cellar of memories</p>
  <p id="authMsg">お酒の記録を保存するため、メールアドレスとパスワードでログインします。</p>
  <form id="authForm">
    <input id="email" type="email" autocomplete="email" placeholder="メールアドレス" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="パスワード（6文字以上）" minlength="6" required>
    <button class="btn" id="authBtn" type="submit">ログイン</button>
  </form>
  <button class="linkbtn" id="authSwitch" type="button">はじめての方は新規登録</button>
</section>

<main id="app" class="hidden">
  <div class="top">
    <h1 class="brand">酒ログ<small>Cellar notes</small></h1>
    <button class="iconbtn" id="logout" type="button">ログアウト</button>
  </div>
  <div class="filters">
    <div class="seg" id="kindFilter">
      <button data-k="all" class="on" type="button">すべて</button>
      <button data-k="wine" type="button">ワイン</button>
      <button data-k="sake" type="button">日本酒</button>
      <button data-k="shochu" type="button">焼酎</button>
      <button data-k="beer" type="button">ビール</button>
    </div>
    <select class="sort" id="sort">
      <option value="date">新しい順</option>
      <option value="rating">評価が高い順</option>
      <option value="again">また買いたい</option>
    </select>
  </div>
  <input class="search" id="q" type="search" placeholder="銘柄・産地・お店で検索">
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty"><b>まだ記録がありません</b>下の「記録する」からラベルを撮ってみましょう。</div>
</main>

<button class="fab hidden" id="fab" type="button"><span>＋</span>記録する</button>

<!-- 追加・編集 -->
<section class="sheet hidden" id="edit">
  <div class="inner">
    <div class="bar"><button id="editClose" type="button">閉じる</button><span class="ttl" id="editTitle">記録する</span><span style="width:3em"></span></div>

    <label class="shot" id="shotBox">
      <b>ラベルを撮る</b>撮影するか、写真を選ぶと<br>AIが銘柄や産地を読み取ります
      <input id="photo" type="file" accept="image/*">
    </label>
    <label class="shot menu" id="menuBox">
      <b>お店のメニューを撮る</b>居酒屋などで、メニューから飲んだお酒を選べます
      <input id="menuPhoto" type="file" accept="image/*">
    </label>
    <div id="photoWrap" class="hidden">
      <div class="picStrip" id="picStrip"></div>
      <p class="pichint" id="picHint">裏ラベルも撮ると、精米歩合や原材料まで読み取りやすくなります（最大4枚）</p>
      <div class="chips" style="margin-top:8px;justify-content:center">
        <button type="button" id="reRead" class="hidden">もう一度読み取る</button>
      </div>
    </div>
    <div class="reading hidden" id="reading"><div class="spin"></div><span id="readingText">ラベルを読み取っています…</span></div>
    <div class="note hidden" id="aiNote"></div>
    <div class="cands hidden" id="menuList"></div>
    <button class="linkbtn" id="manual" type="button">写真なしで手入力する</button>

    <form id="form" class="hidden" autocomplete="off">
      <div class="kindsw">
        <button type="button" data-kind="wine" class="wine">ワイン</button>
        <button type="button" data-kind="sake" class="sake">日本酒</button>
        <button type="button" data-kind="shochu" class="shochu">焼酎</button>
        <button type="button" data-kind="beer" class="beer">ビール</button>
      </div>

      <div class="sec"><h4>銘柄<em id="aiMark" class="hidden">● AIが入力</em></h4>
        <label class="f"><span>銘柄名</span><input name="name" required></label>
        <label class="f"><span id="lbProducer">生産者</span><input name="producer"></label>
        <div class="row">
          <label class="f"><span>国</span><input name="country"></label>
          <label class="f"><span id="lbRegion">地域</span><input name="region"></label>
        </div>
        <div class="only-wine">
          <span class="f"><span>色</span></span>
          <div class="chips" data-chips="wine_color">
            <button type="button" data-v="red">赤</button><button type="button" data-v="white">白</button>
            <button type="button" data-v="rose">ロゼ</button><button type="button" data-v="sparkling">泡</button>
          </div>
          <div class="row">
            <label class="f"><span>ぶどう品種</span><input name="grape"></label>
            <label class="f"><span>ヴィンテージ</span><input name="vintage" inputmode="numeric" placeholder="例 2021"></label>
          </div>
        </div>
        <div class="only-sake">
          <label class="f"><span>特定名称</span><input name="sake_grade" list="grades" placeholder="純米吟醸など"></label>
          <datalist id="grades"><option>純米大吟醸</option><option>大吟醸</option><option>純米吟醸</option><option>吟醸</option><option>特別純米</option><option>純米</option><option>特別本醸造</option><option>本醸造</option><option>普通酒</option></datalist>
          <div class="row">
            <label class="f"><span>精米歩合（%）</span><input name="polish_ratio" inputmode="numeric"></label>
            <label class="f"><span>酒米</span><input name="rice"></label>
          </div>
        </div>
        <div class="only-shochu">
          <span class="f"><span>原料</span></span>
          <div class="chips" data-chips="ingredient">
            <button type="button" data-v="芋">芋</button><button type="button" data-v="麦">麦</button><button type="button" data-v="米">米</button>
            <button type="button" data-v="黒糖">黒糖</button><button type="button" data-v="そば">そば</button><button type="button" data-v="泡盛">泡盛</button><button type="button" data-v="その他">その他</button>
          </div>
          <div class="row">
            <label class="f"><span>麹</span><input name="koji" list="kojis" placeholder="黒麹など"></label>
            <label class="f"><span>度数（%）</span><input name="abv" inputmode="decimal" placeholder="25"></label>
          </div>
          <datalist id="kojis"><option>黒麹</option><option>白麹</option><option>黄麹</option></datalist>
          <span class="f"><span>蒸留</span></span>
          <div class="chips" data-chips="distillation">
            <button type="button" data-v="常圧">常圧</button><button type="button" data-v="減圧">減圧</button>
          </div>
        </div>
        <div class="only-beer">
          <div class="row">
            <label class="f"><span>スタイル</span><input name="beer_style" list="styles" placeholder="IPAなど"></label>
            <label class="f"><span>度数（%）</span><input name="abv_beer" inputmode="decimal" placeholder="5"></label>
          </div>
          <datalist id="styles"><option>ピルスナー</option><option>ラガー</option><option>ペールエール</option><option>IPA</option><option>ヘイジーIPA</option><option>ヴァイツェン</option><option>ホワイトエール</option><option>セゾン</option><option>スタウト</option><option>ポーター</option><option>サワー</option><option>フルーツビール</option></datalist>
        </div>
      </div>

      <button class="webbtn" id="webBtn" type="button">ネットで詳しく調べる<small>1回 約3〜9円・20〜30秒ほど</small></button>
      <div class="reading hidden" id="webReading"><div class="spin"></div>ネットで調べています…（20〜30秒ほどかかります）</div>
      <div class="note hidden" id="webNote"></div>
      <div class="cands hidden" id="candList"></div>
      <label class="f hidden" id="descWrap"><span>特徴（ネットで調べた要約）</span><textarea name="description" style="min-height:80px"></textarea></label>
      <div class="srcs hidden" id="srcList"></div>

      <div class="sec"><h4>味わい</h4>
        <div class="scale" data-scale="bitterness"><small>苦味弱</small><div class="dots"></div><small>苦味強</small></div>
        <div class="scale" data-scale="sweetness"><small id="sweetL">辛口</small><div class="dots"></div><small id="sweetR">甘口</small></div>
        <div class="scale" data-scale="body"><small id="bodyL">軽い</small><div class="dots"></div><small id="bodyR">重い</small></div>
        <div class="only-sake">
          <span class="f"><span>飲んだ温度</span></span>
          <div class="chips" data-chips="serve_temp">
            <button type="button" data-v="冷酒">冷酒</button><button type="button" data-v="常温">常温</button>
            <button type="button" data-v="ぬる燗">ぬる燗</button><button type="button" data-v="熱燗">熱燗</button>
          </div>
        </div>
        <div class="only-shochu">
          <span class="f"><span>飲み方</span></span>
          <div class="chips" data-chips="serve_temp">
            <button type="button" data-v="ストレート">ストレート</button><button type="button" data-v="ロック">ロック</button>
            <button type="button" data-v="水割り">水割り</button><button type="button" data-v="お湯割り">お湯割り</button>
            <button type="button" data-v="ソーダ割り">ソーダ割り</button><button type="button" data-v="前割り">前割り</button>
          </div>
        </div>
        <div class="only-beer">
          <span class="f"><span>飲んだ形</span></span>
          <div class="chips" data-chips="serve_temp">
            <button type="button" data-v="樽生">樽生</button><button type="button" data-v="瓶">瓶</button><button type="button" data-v="缶">缶</button>
          </div>
        </div>
      </div>

      <div class="sec"><h4>感想</h4>
        <div class="rate" id="rate"></div>
        <label class="f"><span>メモ</span><textarea name="memo" placeholder="香り、合わせた料理、誰と飲んだか など"></textarea></label>
        <label class="toggle"><span>また買いたい</span><input type="checkbox" name="buy_again"></label>
      </div>

      <div class="sec"><h4>いつ・どこで</h4>
        <div class="row">
          <label class="f"><span>飲んだ日</span><input name="drank_on" type="date"></label>
          <label class="f"><span>価格（円）</span><input name="price" inputmode="numeric"></label>
        </div>
        <label class="f"><span>買った店</span><input name="shop" list="shops"></label>
        <datalist id="shops"></datalist>
        <label class="f"><span>飲んだ場所</span><input name="place" placeholder="自宅、お店の名前など"></label>
      </div>
    </form>
  </div>
  <div class="savebar hidden" id="saveBar"><button class="btn" id="saveBtn" type="button">保存する</button></div>
</section>

<!-- 詳細 -->
<section class="sheet hidden" id="detail">
  <div class="inner">
    <div class="bar"><button id="detailClose" type="button">戻る</button><span></span><button id="detailEdit" type="button" style="color:var(--ink)">編集</button></div>
    <div id="detailBody"></div>
    <button class="btn danger" id="detailDelete" type="button" style="margin-top:28px">この記録を削除</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
